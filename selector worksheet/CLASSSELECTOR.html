<!DOCTYPE html>
<html>
<head>
    <title>class Selector .Example</title>
    <style>
.red-text {
    color: red;
    }   
.blue-bg {
    background-color: lightblue;
    }
.bold-text {
    font-weight: bold;
    }
    </style>
</head>
<body>  
    <h1 class="red-text">This is a Heading</h1>
    <p class="blue-bg">This is a paragraph.</p>
    <div class="bold-text">This is a div element.</div>
    <span class="red-text blue-bg bold-text">This is a span element.</span>
</html>
