<!--1.	Change .intro text color to green.
2.	Set #container background color to light gray.
3.	Make .card p text color dark gray.
Expected Output:
The page has a light gray background, blue heading, green intro text, and a card paragraph in dark gray.-->
<!DOCTYPE html>
<html>
<head>
    <title>Background Example</title>
    <style>
        #container {
            background-color: lightgray;
            padding: 20px;
        }
        h1 {
            color: blue;
        }
        .intro {
            color: green;
        }
        .card p {
            color: darkgray;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Welcome to My Page</h1>
        <p class="intro">This is the introduction text.</p>
        <div class="card">
            <p>This is a card paragraph.</p>
        </div>
    </div>
</body>
</html>
