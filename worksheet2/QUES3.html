<!--Q5. Table Attributes
Concept: border, cellpadding, cellspacing, width
🧠 Task:
Apply table attributes to enhance spacing and appearance.
<table border="1" cellpadding="10" cellspacing="5" width="50%"-->
<!DOCTYPE html>
<html>          
<head>
    <title>Table Attributes Example</title>
    <style>
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
        }
    </style>                                                        
</head>
<body>  
    <table border="1" cellpadding="10" cellspacing="5" width="50%">
        <tr>
            <th>Header 1</th>
            <th>Header 2</th>
        </tr>
        <tr>
            <td>Data 1</td>
            <td>Data 2</td>
        </tr>
        <tr>
            <td>Data 3</td>
            <td>Data 4</td>
        </tr>
    </table>
