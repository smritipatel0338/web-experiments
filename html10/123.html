<!DOCTYPE html>
<html lang="en"> 
     
    <head>
        <style>
         .parent{
            width: 600px;
            font-size:20px;
            padding: 30px;
            background:lightgrey;
         }
        .child{
            width: 50%;
            height:80px;
            background: orange;

        }
        </style>
         <meta charset="viewport" content="width=device-width, initial-scale=1.0">
         <title>% example</title>   
    </head>
    <body>  
        <h2> PERCENTAGE EXAMPLE </h2>
        <div class="parent">
            This is parent div with width 600px
            <div class="child">
                This child div is 50% width of parent
            </div>
        </div>  
    </body>
</html>
