<!--________________________________________
Q6. HTML Lists
Concept: Ordered, Unordered, and Description Lists
🧠 Task:
Create:
•	A shopping list (unordered)
•	Steps to make tea (ordered)
•	A description list for HTML tags
Expected Output:
- An unordered list with items: Milk, Bread, Eggs   
- An ordered list with steps: Boil water, Add tea leaves, Pour into cup-->
<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists Example</title>
</head>
<body>
    <h2>Shopping List</h2>
    <ul>
        <li>Milk</li>
        <li>Bread</li>
        <li>Eggs</li>
    </ul>

    <h2>Steps to Make Tea</h2>
    <ol>
        <li>Boil water</li>
        <li>Add tea leaves</li>
        <li>Pour into cup</li>
    </ol>

    <h2>Description List for HTML Tags</h2>
    <dl>
        <dt>&lt;html&gt;</dt>
        <dd>The root element of an HTML document.</dd>
        <dt>&lt;head&gt;</dt>
        <dd>Contains meta-information about the document.</dd>
        <dt>&lt;body&gt;</dt>
        <dd>Contains the content of the document.</dd>
    </dl>
</body>
</html>
