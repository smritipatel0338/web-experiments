<!---Q2. Basic Table Structure
Concept: <table>, <tr>, <th>, <td>-->
<!DOCTYPE html>
<html>  
<head>
    <title>Basic Table Structure Example</title>
    <style>
        table {
            border-collapse: collapse;
        }
      
    </style>
</head>
<body>  
    <table border="1" cellpadding="10" cellspacing="5" width="50%">
        <tr>
            <th>Header 1</th>
            <th>Header 2</th>
        </tr>
        <tr>
            <td>Data 1</td>
            <td>Data 2</td>
        </tr>
        <tr>
            <td>Data 3</td>
            <td>Data 4</td>
        </tr>
    </table>
