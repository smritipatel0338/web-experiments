<!DOCTYPE html>
<html>
<head>
    <title>Element Selector Example</title>
    <style>
h1 {
  color: green;
}   
p {
  color: orange;
}
div {
  color: purple;
}
span {
  color: brown;
}
    </style>
</head>
<body>  
    <h1>This is a Heading</h1>
    <p>This is a paragraph.</p>
    <div>This is a div element.</div>
    <span>This is a span element.</span>

</html>
