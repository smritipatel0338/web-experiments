<!DOCTYPE html>
<html lang="en"> 
     
    <head>
         <meta charset="viewport" content="width=device-width, initial-scale=1.0">
         <title>vw vh example</title>
    <style>
        .box-vwvh{
            width:50vw;  /*50% of viewport width*/
            height:30vh;  /*30% of viewport height*/
            background:blue;
        }

    </style>
    </head>
    <body>  
        <h2> VW VH EXAMPLE </h2>
        <div class="box-vwvh">
            This box is 50vw wide and 30vh height
        </div>  
    </body>
