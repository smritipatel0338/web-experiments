<!--Q6. Responsive Tables
Concept: Tables that adapt to screen sizes
🧠 Task:
Wrap a table in a <div> with overflow-x: auto; to allow horizontal scrolling on small screens.-->
<!DOCTYPE html>
<html>  
<head>
    <title>Responsive Table Example</title>
    <style>
        .responsive-table {
            overflow-x: auto;}
        table {
            border-collapse: collapse;
        }
        </style>
</head>
<body>  
    <div class="responsive-table">
        <table border="1" cellpadding="10" cellspacing="5" width="100%">
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
            </tr>
            <tr>
                <td>Apples</td>
                <td>$1.00</td>
                <td>5</td>
                <td>$5.00</td>
            </tr>
            <tr>
                <td>Bananas</td>
                <td>$0.50</td>
                <td>10</td>
                <td>$5.00</td>
            </tr>
            <tr>
                <td>Cherries</td>
                <td>$3.00</td>
                <td>2</td>
                <td>$6.00</td>
            </tr>
        </table>
    </div>
