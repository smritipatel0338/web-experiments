<!DOCTYPE html>
<html>  
<head>
    <title>ID Selector Example.</title>
    <style> 
#unique-heading {
    color: teal;
    }
#unique-paragraph {
    background-color: lightgreen;
    }
#unique-div {
    font-style: italic;
    }
#unique-span {
    text-decoration: underline;
    }
    </style>
</head>
<body>  
    <h1 id="unique-heading">This is a Heading</h1>
    <p id="unique-paragraph">This is a paragraph.</p>
    <div id="unique-div">This is a div element.</div>
    <span id="unique-span">This is a span element.</span>
</body>
</html>
