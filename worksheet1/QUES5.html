<!---Semantic vs Non‑Semantic Elements
🌟 What are Semantic Elements?
Semantic elements are HTML tags that clearly describe their meaning and purpose to both the browser and the developer.
They make the structure of a webpage more readable, meaningful, and SEO‑friendly.
✅ Examples
- <header> — represents the top section of a page or article
- <article> — represents an independent piece of content
- Other examples: <nav>, <section>, <footer>-->


<!--What are Non‑Semantic Elements?
Non‑semantic elements do not describe their content.
They are generic containers used mainly for layout and styling.
✅ Examples
- <div> — generic block container
- <span> — generic inline container
- Other examples: <b>, <i> (older HTML)-->
<!DOCTYPE html>
<html>  
<head>
    <title>Semantic vs Non-Semantic Elements</title>
</head>
<body>
    <h2>Semantic Elements</h2>
    <header>
        <h1>Welcome to My Website</h1>
    </header>
    <article>
        <h2>Article Title</h2>
        <p>This is an independent piece of content.</p>
    </article>
    <footer>
        <p>© 2024 My Website</p>
    </footer>

    <h2>Non-Semantic Elements</h2>
    <div style="border: 1px solid black; padding: 10px;">
        <span style="color: blue;">This is a blue text inside a span.</span>
        <p>This paragraph is inside a div container.</p>
    </div>  
</body>
</html>
